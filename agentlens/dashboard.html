/* Agent avatars */
.agent-avatar{display:inline-flex;align-items:center;gap:.4rem}
.agent-avatar svg{overflow:visible}
.agent-avatar .head{fill:var(--card);stroke:currentColor;stroke-width:2}
.agent-avatar .stroke{stroke:currentColor;stroke-width:2;stroke-linecap:round;fill:none}
.agent-avatar .eyes circle,.agent-avatar .antenna{fill:currentColor}
.agent-avatar .crown{fill:oklch(0.8 0.15 85)}
.agent-avatar .cap{fill:oklch(0.65 0.18 30)}
.agent-avatar .bot{transform-origin:20px 30px;animation:bob 2.4s ease-in-out infinite}
.agent-avatar .eyes{transform-origin:20px 22px;animation:blink 4s infinite}
.lvl-L{color:oklch(0.6 0.15 60)}.lvl-L .bot{animation:wobble 1.6s ease-in-out infinite}
.lvl-P1{color:oklch(0.6 0.18 25)}
.lvl-P2{color:oklch(0.55 0.13 160)}.lvl-P2 .bot{animation-duration:1.8s}
.lvl-FULL{color:oklch(0.5 0.14 250)}.lvl-FULL .antenna{animation:glow 1.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes wobble{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes glow{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.agent-avatar *{animation:none!important}}

const icon = (name, size = 16, cls = "") => `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;
function paintIcons(root = document) { root.querySelectorAll("[data-icon]").forEach(el => { el.outerHTML = icon(el.dataset.icon, Number(el.dataset.size || 16)); }); }
paintIcons();

// ---------------------------------------------------------------- vocabulary
const STATUS = {submitted:"Waiting", verifying:"Verifying…", deciding:"Deciding…", approved:"Approved", declined:"Declined",
                referred:"Referred to a person", held:"Held for review", error:"Error"};
const STATUS_TONE = {submitted:"neutral", verifying:"ai", deciding:"ai", approved:"success", declined:"neutral", referred:"medium", held:"high", error:"critical"};
const AGENT = {intake_agent:"Intake agent", verification_agent:"Verification agent", decision_agent:"Decision agent"};
const WORKING = ["submitted","verifying","deciding"];
// Licences: L-plates -> Red P -> Green P -> Full licence (there is no suspended level)
const LEVELS = ["L","P1","P2","FULL"];
const LV = {L:{name:"L-plates", tone:"medium", plate:"l", letter:"L"}, P1:{name:"Red P", tone:"high", plate:"P1", letter:"P"},
            P2:{name:"Green P", tone:"ai", plate:"P2", letter:"P"}, FULL:{name:"Full licence", tone:"success"}};
const LADDER_TONE = {L:"critical", P1:"high", P2:"success", FULL:"success"};

// ---------------------------------------------------------------- primitives (ported from components/agentlens/primitives.tsx)
const pill = (html, tone = "neutral", extra = "") => `<span class="pill tone-${tone} ${extra}">${html}</span>`;
const statusPill = (s) => pill(`${s === "approved" ? icon("check", 12) : icon("dot", 7)}${esc(STATUS[s] || s)}`, STATUS_TONE[s] || "neutral",
                                (s === "verifying" || s === "deciding") ? "gentle-pulse" : "");
const sevPill = (sev) => pill(esc(sev), String(sev || "").toLowerCase());
const typeTone = (t) => t === "CRITICAL" ? "critical" : t === "MAJOR" ? "high" : "medium";
function licence(level, size = 46) {
  const i = LV[level] || LV.L, eye = level === "L" ? 2.4 : 2;
  const plate = i.plate ? `<span class="plate plate-${i.plate}">${i.letter}</span>` : icon("check", 11);
  return `<span class="agent-avatar lvl-${level}" title="${i.name}"><svg viewBox="0 0 40 40" width="${size}" height="${size}" aria-hidden="true"><g class="bot">`
    + (level === "FULL" ? `<path class="crown" d="M12 9l4 4 4-6 4 6 4-4-1 6H13z"/>` : "")
    + (level === "L" ? `<rect class="cap" x="13" y="7" width="14" height="6" rx="2"/>` : "")
    + `<line x1="20" y1="14" x2="20" y2="10" class="stroke"/><circle cx="20" cy="9" r="1.6" class="antenna"/><rect x="9" y="14" width="22" height="17" rx="6" class="head"/>`
    + `<g class="eyes"><circle cx="16" cy="22" r="${eye}"/><circle cx="24" cy="22" r="${eye}"/></g>`
    + `<path d="${level === "FULL" || level === "P2" ? "M15.5 26.5q4.5 3 9 0" : "M17 27h6"}" class="stroke"/></g></svg>${pill(plate + i.name, i.tone)}</span>`;
}
const bar = (value, tone = "success") => `<div class="progress-track tone-${tone}"><progress max="100" value="${Math.max(0, Math.min(100, value || 0))}"></progress></div>`;
const probTone = (p) => p >= .7 ? "success" : p >= .4 ? "high" : "critical";
function probability(p) {
  if (p == null) return `<span class="muted">n/a</span>`;
  const v = p > 1 ? p / 100 : p;
  return `<div class="probability">${bar(v * 100, probTone(v))}<strong>${Math.round(v * 100)}%</strong></div>`;
}
const empty = (title, desc = "", action = "") => `<div class="empty-state"><div class="empty-icon">${icon("shield-check", 27)}</div><h3>${title}</h3>${desc ? `<p>${desc}</p>` : ""}${action}</div>`;
const skeleton = (rows = 3) => `<div class="loading-lines" aria-label="Loading" aria-busy="true">${Array.from({length: rows}, () => `<div class="skeleton-line"></div>`).join("")}</div>`;
const errorNote = (msg) => `<div class="error-note">${icon("alert", 18)}<span>${esc(msg)}</span></div>`;
function mistakeCard(m, caseLink = "") {
  return `<article class="mistake-card"><div class="mc-top">${pill(esc(m.mistake_type), typeTone(m.mistake_type))}<strong>${esc(m.title)}</strong>${caseLink}</div>
    <p class="muted small">${esc(m.agent_label || AGENT[m.agent_name] || "")} · rule ${esc(m.rule)}${m.earlier_run ? " · earlier run" : ""}${m.resolved ? " · fixed" : ""}</p>
    <div class="comparison-text"><div class="tinted tone-critical"><label>What the agent concluded</label><p>${esc(m.agent_stated_reasoning)}</p></div>
      <div class="tinted tone-success"><label>What should have happened</label><p>${esc(m.what_should_have_happened)}</p></div></div>
    ${m.mistake_reason ? `<p><strong>Why it’s wrong: </strong>${esc(m.mistake_reason)}</p>` : ""}</article>`;
}

// ---------------------------------------------------------------- toasts + dialogs (replace window.alert / confirm / prompt)
function toast(msg, kind = "ok") {
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  el.innerHTML = `${icon(kind === "ok" ? "check" : "alert", 15)}<span>${esc(msg)}</span>`;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), kind === "ok" ? 3500 : 6000);
}
let dlgPending = false;
function dialog({title, description = "", fields = [], label = "Confirm", danger = false, onConfirm}) {
  const box = $("dlg");
  box.innerHTML = `<div class="dialog-content" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div><h2 id="dlgTitle">${esc(title)}</h2>${description ? `<p class="dialog-desc" style="margin-top:6px">${esc(description)}</p>` : ""}</div>
    ${fields.map(f => `<label class="field">${esc(f.label)}${f.textarea
        ? `<textarea class="input" id="f_${f.id}" rows="4">${esc(f.value || "")}</textarea>`
        : `<input class="input" id="f_${f.id}" value="${esc(f.value || "")}" placeholder="${esc(f.placeholder || "")}" autocomplete="off">`}${f.help ? `<small>${esc(f.help)}</small>` : ""}</label>`).join("")}
    <p class="text-destructive small" id="dlgErr" role="alert" style="color:var(--critical-text)" hidden></p>
    <div class="dialog-footer"><button class="btn btn-outline" id="dlgCancel">Cancel</button>
      <button class="btn ${danger ? "btn-outline danger-outline" : ""}" id="dlgOk">${esc(label)}</button></div></div>`;
  box.hidden = false;
  const ok = $("dlgOk"), inputs = fields.map(f => $(`f_${f.id}`));
  const check = () => { ok.disabled = dlgPending || fields.some((f, i) => f.required !== false && !inputs[i].value.trim()); };
  inputs.forEach(i => i.oninput = check); check();
  (inputs[0] || ok).focus();
  const close = () => { if (!dlgPending) { box.hidden = true; box.innerHTML = ""; } };
  $("dlgCancel").onclick = close;
  box.onclick = (e) => { if (e.target === box) close(); };
  box.onkeydown = (e) => { if (e.key === "Escape") close(); if (e.key === "Enter" && e.target.tagName === "INPUT" && !ok.disabled) ok.click(); };
  ok.onclick = async () => {
    const values = Object.fromEntries(fields.map((f, i) => [f.id, inputs[i].value.trim()]));
    dlgPending = true; check(); ok.textContent = "Working…"; $("dlgCancel").disabled = true;
    try { await onConfirm(values); dlgPending = false; close(); toast("Request completed"); }
    catch (e) { dlgPending = false; $("dlgCancel").disabled = false; ok.textContent = label; check(); $("dlgErr").hidden = false; $("dlgErr").textContent = e.message; }
    refresh();
  };
}
const dialogOpen = () => !$("dlg").hidden || !$("modal").hidden;
const lastName = () => { try { return localStorage.getItem("agentlens-reviewer") || ""; } catch (e) { return ""; } };
const rememberName = (n) => { try { localStorage.setItem("agentlens-reviewer", n); } catch (e) {} };

// ---------------------------------------------------------------- state + api
const S = {view:"review", o:null, caseId:null, caseTab:"summary", caseStatus:null, caseData:null, appsFilter:"all",
           search:"", agent:"verification_agent", reveal:{}, explain:{}, showSystem:false, back:null, head:null, sig:null, offline:false};

async function api(path, opts = {}) {
  let r;
  try { r = await fetch(path, {headers:{"Content-Type":"application/json"}, cache:"no-store", ...opts}); }
  catch (e) { throw new Error("Cannot reach the AgentLens API. Check that it is running."); }
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(r.status === 409 ? "Busy: wait for the current job to finish" : typeof out.detail === "string" ? out.detail : `The API could not complete this request (${r.status}).`);
  return out;
}
const post = (path, body = {}) => api(path, {method:"POST", body:JSON.stringify(body)});

// ---------------------------------------------------------------- navigation
function markNav() {
  const v = S.view === "case" ? (S.back || "applications") : S.view;
  document.querySelectorAll(".nav-link").forEach(b => b.classList.toggle("nav-active", b.dataset.view === v));
}
function go(view) {
  S.view = view;
  if (view !== "case") S.back = null;
  markNav();
  history.replaceState(null, "", view === "case" ? `?case=${encodeURIComponent(S.caseId)}` : `?view=${view}`);
  $("sidebar").classList.remove("sidebar-open");
  S.sig = null; S.head = null;
  render();
  window.scrollTo(0, 0);
}
document.querySelectorAll(".nav-link").forEach(b => b.onclick = () => go(b.dataset.view));
document.querySelectorAll("[data-home]").forEach(a => a.onclick = (e) => { e.preventDefault(); go("review"); });
$("menuBtn").onclick = () => $("sidebar").classList.toggle("sidebar-open");
function openCase(caseId, from) { S.caseId = caseId; S.caseTab = "summary"; S.caseStatus = null; S.back = from || S.view; go("case"); }

// theme
function paintTheme() { const dark = document.documentElement.classList.contains("dark"); $("themeLabel").textContent = dark ? "Light" : "Dark"; }
$("themeBtn").onclick = () => {
  const dark = document.documentElement.classList.toggle("dark");
  try { localStorage.setItem("agentlens-theme", dark ? "dark" : "light"); } catch (e) {}
  paintTheme();
};
paintTheme();

// ---------------------------------------------------------------- shell
function setHead(title, description, action = "") {
  const key = title + "|" + description + "|" + action;
  if (S.head === key) return;
  S.head = key;
  $("pageHead").innerHTML = `<div class="page-header"><div><div class="eyebrow">HUMAN OVERSIGHT, BUILT IN</div><h1>${title}</h1><p>${description}</p></div>
    ${action || `<div class="reviewer-label">${icon("shield-check", 15)}Credit reviewer</div>`}</div>`;
  wireHeadActions();
}
function wireHeadActions() {
  const inc = $("incident");
  if (inc) inc.onclick = () => dialog({title:"Simulate a critical incident?",
    description:"The decision agent approves a loan despite a failed credit check (LOAN-0047). AgentLens should catch it, hold the case and send the agent straight back to L-plates.",
    label:"Run the incident", danger:true, onConfirm:() => post("/api/jobs/incident")});
  idle(S.o?.job.running);
}
function idle(busy) { document.querySelectorAll("[data-idle]").forEach(b => b.disabled = !!busy); }

function renderChrome(o) {
  const s = o.stats, j = o.job;
  $("nReview").textContent = s.held; $("nApps").textContent = s.total; $("nReviewed").textContent = s.reviewed;
  $("nAgents").textContent = o.agents.length;
  $("nSug").textContent = o.suggestions.filter(x => ["proposed","testing"].includes(x.status)).length;
  $("storage").textContent = o.storage === "supabase" ? "Supabase" : "Local storage";
  $("dot").className = $("topDot").className = "online-dot";
  $("topState").textContent = "Live monitoring";
  $("waitBtn").hidden = !s.waiting; $("waitBtn").textContent = `Process waiting (${s.waiting})`;
  let html;
  if (j.running) html = `${icon("loader", 15, "spin")}<span>${esc(j.message || "Processing applications…")}</span><span class="job-count">${j.done} / ${j.total}</span>${bar(j.total ? j.done / j.total * 100 : 0)}`;
  else if (j.error) html = `${pill("Error", "critical")}<span>${esc(j.message || j.error)}</span>`;
  else if (s.in_progress) html = `${icon("loader", 15, "spin")}<span>The agents are working</span><span class="job-count">${s.in_progress} application${s.in_progress === 1 ? "" : "s"} being processed</span>`;
  else if (j.message) html = `${icon("check-check", 16, "success-text")}<span>${esc(j.message)}</span>`;
  else html = `<span class="online-dot"></span><span>AgentLens is monitoring every decision.</span><span class="job-count">Human review stays in control</span>`;
  $("jobBanner").innerHTML = html;
  idle(j.running);
}
function renderOffline(msg) {
  $("dot").className = $("topDot").className = "offline-dot";
  $("storage").textContent = "Not connected"; $("topState").textContent = "Awaiting connection";

// ---------------------------------------------------------------- render dispatch
function render() {

// ---------------------------------------------------------------- Review queue

    <div class="stat-card"><div class="stat-heading">Processed ${icon("layout-list")}</div>
      <div class="stat-value">${s.processed}<span>of ${s.total}</span></div>${bar(s.total ? s.processed / s.total * 100 : 0)}
      <p class="caption">${s.cleared} cleared automatically · ${s.reviewed} reviewed by a person</p></div>
    <div class="stat-card stat-held"><div class="stat-heading">Held for review ${icon("alert")}</div>
      <div class="stat-value">${s.held}</div>
      <div class="severity-chips">${["Critical","High","Medium"].filter(k => s.held_by_severity[k]).map(k => pill(`${s.held_by_severity[k]} ${k.toLowerCase()}`, k.toLowerCase())).join("") || pill("Nothing held", "success")}</div>
      <p class="caption">Nothing has been sent to these customers yet.</p></div>
    <div class="stat-card stat-agents"><div class="stat-heading">Agents ${icon("bot")}</div>
      <div class="stat-value">${o.agents.length}<span>${o.agents.filter(a => a.level !== "FULL").length} learning</span></div>
      <div class="agent-mini-list">${o.agents.map(a => `<div class="agent-mini">${licence(a.level, 24)}<span class="agent-mini-name">${esc(a.label)}</span><strong>${Math.round(a.trust_score)}</strong></div>`).join("")}</div></div>
  </div>`;
}
function renderReview() {
  const o = S.o, q = o.queue;
  setHead("Review queue", "Applications the agents held for a person to check. Nothing was sent to these customers yet.");
  if (!S.caseId || !q.some(x => x.case_id === S.caseId)) { S.caseId = q[0]?.case_id || null; S.caseStatus = null; }
  if (!$("reviewLayout")) {
    $("view").innerHTML = `<div id="reviewStats"></div>
      <div class="section-heading"><h2>Waiting for you</h2><span id="queueCount"></span></div>
      <div id="reviewLayout"></div>`;
  }
  $("reviewStats").innerHTML = statCards(o);
  $("queueCount").textContent = q.length ? `${q.length} held · most serious first` : "";
  const layout = $("reviewLayout");
  if (!q.length) {
    layout.className = ""; layout.innerHTML = o.stats.total

      <section class="case-panel" id="caseHost" data-case="" aria-live="polite"></section>`;
  }
  $("queueList").innerHTML = q.map(c => `<button class="queue-card tone-${esc(c.severity.toLowerCase())} ${c.case_id === S.caseId ? "selected" : ""}" data-case="${esc(c.case_id)}">
      <strong>${esc(c.title)}</strong>
      <div class="queue-card-bottom"><span class="mono">${esc(c.case_id)} · ${kmoney(c.amount)}</span>${sevPill(c.severity)}</div></button>`).join("");
  document.querySelectorAll(".queue-card").forEach(b => b.onclick = () => { S.caseId = b.dataset.case; S.caseTab = "summary"; S.caseStatus = null; renderReview(); });
  const host = $("caseHost");
  if (host.dataset.case !== S.caseId || o.statuses[S.caseId] !== S.caseStatus) { host.dataset.case = S.caseId; loadCase(host); }

// ---------------------------------------------------------------- Case (page + panel)
function renderCasePage() {
  const backName = {applications:"All applications", reviewed:"Reviewed", review:"Review queue", agents:"Agents & licences", improve:"Improvements"}[S.back] || "All applications";
  setHead(`Case ${esc(S.caseId)}`, "The application, its documents and every step the agents took, checked by AgentLens.");

async function loadCase(host) {
  const id = S.caseId;
  if (!host.innerHTML.trim()) host.innerHTML = `<div class="case-body">${skeleton(6)}</div>`;
  let d;
  try { d = await api(`/api/case/${id}`); } catch (e) { host.innerHTML = `<div class="case-body">${errorNote(e.message)}</div>`; return; }
  if (S.caseId !== id) return;
  S.caseData = d; S.caseStatus = d.status;
  renderCase(host, d);
}
function renderCase(host, d) {
  const m = d.primary, det = (m && m.details) || {}, p = d.approval_probability;
  const tabs = [["summary","Summary"],["form","Application form"],["docs","Documents"],["activity",`Activity (${d.timeline.length})`]];
  host.innerHTML = `<div class="case-header">
      <div class="case-id-line"><span class="mono">${esc(d.case_id)} · ${esc(d.token)}${m ? ` · ${esc(m.agent_label)}` : ""}</span>${statusPill(d.status)}${m ? sevPill(det.severity) : ""}</div>
      <div class="fact-grid">
        <div class="fact-tile"><label>Loan</label><strong>${money(d.amount)} · ${esc(d.purpose)}</strong><span>${d.term_years ? d.term_years + " years" : "Term not given"}</span></div>

        <div class="fact-tile"><label>Estimated result</label><strong>${esc(d.estimated_timeframe || "—")}</strong><span>${d.status === "approved" || d.status === "declined" ? "Decided" : "By " + when(d.estimated_decision_by)}</span></div>
        <div class="fact-tile"><label>Submitted</label><strong>${when(d.submitted_at)}</strong>${d.reviewed_by ? `<span>Reviewed by ${esc(d.reviewed_by)}</span>` : ""}</div>
      </div></div>
    <div class="case-tabs" role="tablist">${tabs.map(([k, l]) => `<button class="case-tab ${S.caseTab === k ? "active" : ""}" role="tab" aria-selected="${S.caseTab === k}" data-t="${k}">${l}</button>`).join("")}</div>
    <div class="case-body" id="ctab"></div>`;
  host.querySelectorAll(".case-tab").forEach(b => b.onclick = () => { S.caseTab = b.dataset.t; renderCase(host, d); });
  const t = $("ctab");
  ({summary:caseSummary, form:caseForm, docs:caseDocs, activity:caseActivity}[S.caseTab] || caseSummary)(t, d);

function caseSummary(t, d) {
  const m = d.primary, det = (m && m.details) || {}, held = d.status === "held", working = WORKING.includes(d.status);
  const chip = (c) => pill(`${c.state === "bad" ? icon("x", 11) : c.state === "ok" ? icon("check", 11) : icon("circle", 9)}${esc(c.label)}`,
                           c.state === "bad" ? "critical" : c.state === "ok" ? "success" : "neutral");
  const end = held ? pill(`${icon("flag", 11)}Held`, "high") : working ? pill(`${icon("loader", 11, "spin")}In progress`, "ai")
                   : pill(`${icon("check", 11)}${esc(STATUS[d.status] || d.status)}`, "success");
  const dec = d.agent_decision;
  t.innerHTML = `${m ? `<h2 class="case-title">${esc(det.title)}</h2>
      <div class="compare-values">
        <div class="compare-box"><label>${esc(det.left?.label)}</label><strong>${esc(det.left?.value)}</strong><span>${esc(det.left?.sub)}</span></div>
        ${icon("arrow-right", 20)}
        <div class="compare-box tone-critical"><label>${esc(det.right?.label)}</label><strong>${esc(det.right?.value)}</strong><span>${esc(det.right?.sub)}</span></div>
      </div>
      <div class="ai-box">${icon("sparkles")}<div id="aiText"><p>Explaining what went wrong…</p></div></div>`
    : working ? `<h2 class="case-title">The agents are working on this case</h2>
      <div class="ai-box">${icon("loader", 16, "spin")}<div><p><strong style="margin:0">${d.status === "submitted" ? "Waiting for its turn" : d.status === "verifying" ? "The verification agent is checking the documents" : "The decision agent is deciding"}</strong></p>
        <p>AgentLens checks every step after each agent, before the customer hears anything.</p></div></div>`
    : `<h2 class="case-title">No problems found</h2>
      <div class="clear-box">${icon("check-check", 18)}<div><strong>AgentLens checked every step and found nothing wrong.</strong> Outcome: <strong>${esc(STATUS[d.status] || d.status)}</strong>. This case counts towards the agents’ clean record.</div></div>`}
    <div class="steps-section"><h3>${m ? "Where it went wrong" : "Steps"}</h3>
      <div class="step-chips">${d.chips.map(chip).join(`<span class="step-arrow">→</span>`)}<span class="step-arrow">→</span>${end}</div></div>
    ${held ? `<div class="review-actions">
      <button class="btn" data-act="recalculate" data-idle>${icon("rotate", 14)}Send back to recalculate</button>
      <button class="btn btn-outline" data-act="approve" data-idle>${icon("check", 14)}Approve anyway</button>
      <button class="btn btn-outline danger-outline" data-act="decline" data-idle>${icon("x", 14)}Decline</button></div>` : ""}
    ${dec ? `<div class="reasoning"><h3>Decision agent’s reasoning</h3>
      <div class="step-chips">${statusPill(dec.decision === "refer_to_human" ? "referred" : dec.decision)}${pill(dec.confidence == null ? "Rules (AI offline)" : `Confidence ${dec.confidence}%`, "neutral")}${dec.borderline ? pill("Borderline", "medium") : ""}</div>
      <p>${esc(dec.reasoning)}</p>
      <p>Hard rules said: <strong>${esc(String(dec.rules_decision || "").replace(/_/g, " "))}</strong>. ${esc(dec.note || "")}</p></div>` : ""}
    ${d.mistakes.length ? `<div class="findings"><h3>What AgentLens found (${d.mistakes.length})</h3>${d.mistakes.map(x => mistakeCard(x)).join("")}</div>` : ""}`;
  t.querySelectorAll("[data-act]").forEach(b => b.onclick = () => review(d.case_id, b.dataset.act));
  if (m) loadExplain(d.case_id);
}
async function loadExplain(id) {
  if (!S.explain[id]) S.explain[id] = api(`/api/case/${id}/explain`).catch(() => null);
  const x = await S.explain[id];
  if (!$("aiText") || S.caseId !== id) return;
  $("aiText").innerHTML = x ? `<p>${esc(x.explanation)}</p>${x.action ? `<span class="ai-action">→ ${esc(x.action)}</span>` : ""}<span class="ai-tag">${x.by === "ai" ? "AI explanation" : "Rule-based explanation"}</span>` : "";
}
function review(id, action) {
  const text = {recalculate:["Send back to recalculate?", "The case goes back to the agents with the mistake corrected.", "Send back"],
                approve:["Approve anyway?", "The loan is approved despite what AgentLens found. Your name is recorded on the case.", "Approve"],
                decline:["Decline this application?", "The customer is told the application was declined. Your name is recorded on the case.", "Decline"]}[action];
  dialog({title:`${id}: ${text[0]}`, description:text[1], label:text[2], danger:action === "decline",
    fields:[{id:"name", label:"Your name", value:lastName(), placeholder:"Full name", help:"Every human decision is recorded with a name."}],
    onConfirm:async ({name}) => { rememberName(name); await post(`/api/jobs/review/${id}`, {action, reviewer:name}); S.explain[id] = null; S.caseStatus = null; }});
}

function privacyBar(id) {
  const on = S.reveal[id];
  return `<div class="privacy-bar">${icon(on ? "eye" : "lock")}<span>${on ? "Personal details are showing. This view was logged in the audit trail." : "Personal details are hidden. The AI agents never see them either."}</span>
    <button class="btn btn-outline btn-sm" id="revealBtn">${icon(on ? "eye-off" : "eye", 14)}${on ? "Hide personal details" : "Show personal details"}</button></div>`;
}
function wireReveal(id, rerender) {
  $("revealBtn").onclick = () => {
    if (S.reveal[id]) { S.reveal[id] = false; rerender(); return; }
    dialog({title:"Show personal details?", description:`This shows the customer's name, date of birth, address and account for ${id}. Every view is logged in the audit trail.`,
            label:"Show details", onConfirm:async () => { S.reveal[id] = true; rerender(); }});
  };
}
async function caseForm(t, d) {
  t.innerHTML = skeleton(5);
  let f;
  try { f = await api(`/bank/applications/${d.case_id}/form?reveal=${!!S.reveal[d.case_id]}`); } catch (e) { t.innerHTML = errorNote(e.message); return; }

async function caseDocs(t, d) {

$("modalClose").onclick = () => $("modal").hidden = true;
$("modal").onclick = (e) => { if (e.target === $("modal")) $("modal").hidden = true; };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("modal").hidden = true; });

function caseActivity(t, d) {
  const wrong = new Map(d.mistakes.filter(x => !x.earlier_run).map(x => [x.event_id, x]));
  const evs = d.timeline.filter(e => S.showSystem || !e.system);
  const groups = [];
  for (const e of evs) {
    const last = groups[groups.length - 1];
    if (last && last.label === e.agent_label) last.items.push(e); else groups.push({label:e.agent_label, items:[e]});
  }
  const ev = (e) => {
    const mk = wrong.get(e.event_id), tone = e.result === "pass" ? "success" : e.result === "fail" ? "critical" : "high";
    return `<div class="timeline-event ${mk ? "flagged-event" : ""}">
      <span class="event-icon tone-${tone}">${icon(e.result === "pass" ? "check" : e.result === "fail" ? "x" : "alert", 12)}</span>
      <div class="timeline-event-content"><strong>${esc(e.title)}</strong>${e.note && e.note !== e.title ? `<p>${esc(e.note)}</p>` : ""}
        ${e.facts.length ? `<dl class="event-facts">${e.facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}
        ${mk ? `<div class="event-finding">${icon("flag", 12)}AgentLens: ${esc(mk.title)} (${esc(mk.mistake_type)})</div>` : ""}</div>
      <div class="event-meta"><span>#${e.event_id}</span><span>${when(e.time)}</span></div></div>`;
  };
  t.innerHTML = `<div class="timeline-controls"><label class="checkbox-line"><input type="checkbox" id="sys" ${S.showSystem ? "checked" : ""}> Show system steps (tickets, handoffs)</label>
      <span class="muted">${d.timeline.length} steps in the event log</span></div>
    <div class="timeline">${groups.map(g => `<section class="timeline-group"><h3>${icon("bot", 14)}${esc(g.label)}<span class="muted" style="margin-left:auto;font-weight:400">${g.items.length} step${g.items.length === 1 ? "" : "s"}</span></h3>
      ${g.items.map(ev).join("")}</section>`).join("") || empty("No events yet")}</div>`;
  $("sys").onchange = (e) => { S.showSystem = e.target.checked; caseActivity(t, d); };
}

        <div class="agent-card-header"><button class="btn btn-ghost agent-select"><h3>${esc(a.label)}</h3></button>${licence(a.level)}</div>
        <div class="trust-score">${Math.round(a.trust_score)}</div><div class="trust-label">trust score</div>
        <div class="licence-ladder tone-${LADDER_TONE[a.level]}">${LEVELS.map((l, i) => `<span class="ladder-step ${i <= idx ? "filled" : ""}">${LV[l].name}</span>`).join("")}</div>
        <dl class="agent-metrics">
          <dt>Mistake rate (last ${a.recent_cases.length} cases)</dt><dd>${Math.round(a.mistake_rate * 100)}%</dd>
          <dt>A person checks</dt><dd>${Math.round(a.human_review_rate * 100)}% of its cases</dd>
          <dt>Cases at this level</dt><dd>${a.cases_at_level}${a.level !== "FULL" ? ` of ${a.cases_needed_to_promote} needed` : ""}</dd>
          <dt>Open mistakes</dt><dd>${a.open_mistakes}</dd>
        </dl>
        ${a.fast_track ? pill(`${icon("zap", 11)}Fast-tracked after a fix`, "ai") : ""}
        ${a.level !== "FULL" ? `<button class="btn btn-outline promote-button" data-promote="${esc(a.agent_name)}" data-idle>Promote to ${LV[LEVELS[idx + 1]].name}…</button>` : ""}
      </article>`; }).join("")}</div>
    <div class="agent-detail-columns">
      <section><div class="section-heading"><h2>Mistakes · ${esc(AGENT[S.agent])}</h2></div><div id="mlog">${skeleton(3)}</div></section>
      <section><div class="section-heading"><h2>Licence history</h2><span>${o.history.length} changes</span></div>
        <div class="history-list">${o.history.length ? o.history.map(h => `<div class="history-item">
          <span class="score-change ${h.score_change < 0 ? "" : "unchanged"}">${h.score_change > 0 ? "+" : ""}${h.score_change}</span>
          <div><strong>${esc(AGENT[h.agent_name] || h.agent_name)}</strong>: ${esc(h.reason)}
            <p class="muted">Score ${h.new_score} · ${esc((LV[h.new_level] || {}).name || h.new_level)}${h.case_id ? " · " + esc(h.case_id) : ""}</p></div></div>`).join("")
          : empty("No changes yet")}</div></section>
    </div>`;
  document.querySelectorAll(".agent-card").forEach(c => c.onclick = () => { S.agent = c.dataset.agent; S.sig = null; renderAgents(); });
  document.querySelectorAll("[data-promote]").forEach(b => b.onclick = (e) => { e.stopPropagation(); promote(b.dataset.promote); });
  loadMistakes();
}
async function loadMistakes() {
  const agent = S.agent;
  try {
    const d = await api(`/api/agent/${agent}`);
    if (S.view !== "agents" || S.agent !== agent || !$("mlog")) return;
    $("mlog").innerHTML = d.mistakes.length
      ? d.mistakes.slice().reverse().map(x => mistakeCard({...x, agent_label:AGENT[agent]}, `<button class="case-link" data-case="${esc(x.case_id)}">${esc(x.case_id)}</button>`)).join("")
      : `<div class="history-list">${empty("A clean record", "No mistakes recorded for this agent.")}</div>`;
    $("mlog").querySelectorAll("[data-case]").forEach(a => a.onclick = () => openCase(a.dataset.case, "agents"));
  } catch (e) { if ($("mlog")) $("mlog").innerHTML = errorNote(e.message); }
}
function promote(agent) {
  const a = S.o.agents.find(x => x.agent_name === agent), next = LV[LEVELS[LEVELS.indexOf(a.level) + 1]].name;
  dialog({title:`Promote the ${AGENT[agent]} to ${next}?`, description:"Promotion is never automatic: it always needs a named person, and only after enough clean cases at this level.",
    label:"Promote", fields:[{id:"name", label:"Your name", value:lastName(), placeholder:"Full name"}],
    onConfirm:async ({name}) => { rememberName(name); await post(`/licence/${agent}/promote`, {approved_by:name}); }});
}

// ---------------------------------------------------------------- Improvements
function renderImprove() {
  const o = S.o;
  setHead("Improvements", "When an agent repeats the same mistake on 3 cases, AgentLens suggests a fix, then proves it by replaying the failed cases.",
          `<button class="btn btn-outline danger-outline" id="incident" data-idle>${icon("alert", 14)}Simulate a critical incident</button>`);
  const steps = [["Pattern","The same mistake on 3+ cases becomes a suggested fix."],["Apply","A named person approves it. The agent goes back to L-plates."],
                 ["Verify","Replay every case it got wrong, with the fix."],["Resolve or iterate","All pass: fast-track. Some fail: a new suggestion."]];
  $("view").innerHTML = `<div class="improvement-strip">${steps.map(([t, p], i) => `<div class="improvement-step"><span>${i + 1}</span><div><strong>${t}</strong><p>${p}</p></div></div>`).join("")}</div>
    ${o.suggestions.length ? o.suggestions.map(s => { const vr = s.verify_result; return `<article class="suggestion-card">
      <div class="suggestion-header">${pill(esc(s.status), s.status)}<strong>#${s.id} · ${esc(AGENT[s.agent_name] || s.agent_name)}</strong>${pill(`Round ${s.iteration}`, "neutral")}
        <span class="muted">${(s.case_ids || []).length} cases${s.parent_id ? ` · follows #${s.parent_id}` : ""}</span></div>
      <dl class="definition-list"><dt>Pattern</dt><dd>${esc(s.pattern_description)}</dd><dt>Root cause</dt><dd>${esc(s.root_cause)}</dd>
        <dt>Fix</dt><dd><strong>${esc(s.fix_description || s.suggested_fix)}</strong>${s.applied_by ? ` <span class="muted">· approved by ${esc(s.applied_by)}</span>` : ""}</dd>
        <dt>Cases</dt><dd class="case-links">${(s.case_ids || []).map(c => `<button class="case-link" data-case="${esc(c)}">${esc(c)}</button>`).join("")}</dd>
        ${vr ? `<dt>Replay result</dt><dd>${vr.passed.length} of ${vr.replayed} now pass${vr.failed.length ? `; still failing: <strong>${esc(vr.failed.join(", "))}</strong>` : ` ${icon("check", 12)}`}</dd>` : ""}</dl>
      ${s.status === "proposed" ? `<button class="btn" data-apply="${s.id}" data-idle>${icon("check", 14)}Apply fix…</button>` : ""}
      ${s.status === "testing" ? `<button class="btn" data-verify="${s.id}" data-idle>${icon("rotate", 14)}Verify: replay ${(s.case_ids || []).length} cases</button>` : ""}
    </article>`; }).join("") : `<div class="data-table-wrap">${empty("No improvements suggested yet", "Run the demo batch: the verification agent repeats the same mistake 3 times.")}</div>`}`;
  document.querySelectorAll("[data-apply]").forEach(b => b.onclick = () => applyFix(b.dataset.apply));
  document.querySelectorAll("[data-verify]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await post(`/api/jobs/verify/${b.dataset.verify}`); toast("Replaying the failed cases with the fix…"); } catch (e) { toast(e.message, "err"); }
    refresh();
  });
  document.querySelectorAll(".case-links [data-case]").forEach(a => a.onclick = () => openCase(a.dataset.case, "improve"));
  wireHeadActions();
}
function applyFix(id) {
  const s = S.o.suggestions.find(x => String(x.id) === String(id));
  dialog({title:`Apply fix #${id} to the ${AGENT[s.agent_name]}?`, description:"The agent goes back to L-plates while the fix is re-tested on the cases it got wrong.",
    label:"Apply fix", fields:[{id:"name", label:"Approved by", value:lastName(), placeholder:"Full name"}, {id:"fix", label:"Fix description", value:s.suggested_fix, textarea:true}],
    onConfirm:async ({name, fix}) => { rememberName(name); await post(`/improve/${id}/apply`, {approved_by:name, fix_description:fix}); }});
}

// ---------------------------------------------------------------- demo controls
$("runBtn").onclick = () => {
  const n = Number($("count").value);
  dialog({title:"Run a fresh demo batch?", description:"This CLEARS the demo data and submits a fresh batch of synthetic applications. The agents process them one by one while AgentLens watches.",
    label:`Run ${n} applications`, onConfirm:async () => { S.caseId = null; S.explain = {}; S.reveal = {}; await post("/api/jobs/batch", {count:n}); go("review"); }});
};
$("waitBtn").onclick = async () => { try { await post("/api/jobs/process_waiting"); } catch (e) { toast(e.message, "err"); } refresh(); };

// ---------------------------------------------------------------- polling
async function refresh() {
  let o;
  try { o = await api("/api/overview"); } catch (e) { renderOffline(e.message); return; }
  S.o = o;
  renderChrome(o);
  // redraw only when something on this view changed (keeps open tabs, scroll and dialogs as they are)
  const sig = JSON.stringify([S.view, S.agent, o.queue, o.stats, o.agents.map(a => [a.level, a.trust_score, a.cases_at_level, a.open_mistakes, a.fast_track]),
                              o.applications, o.history, o.suggestions, o.job.running, S.caseId && o.statuses[S.caseId]]);
  if (sig !== S.sig && !dialogOpen()) { S.sig = sig; render(); }
}
const params = new URLSearchParams(location.search);
if (params.get("case")) { S.caseId = params.get("case"); S.view = "case"; S.back = "applications"; }
else if (params.get("view")) S.view = params.get("view");
markNav();
$("pageHead").innerHTML = `<div class="page-header"><div><div class="eyebrow">HUMAN OVERSIGHT, BUILT IN</div><h1>AgentLens</h1><p>Connecting to your AgentLens API…</p></div></div>`;
$("view").innerHTML = skeleton(5);
refresh();
setInterval(refresh, 2500);
</script>
</body>
</html>
